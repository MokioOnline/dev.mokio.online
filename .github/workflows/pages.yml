name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          VITE_USER_SUPABASE_URL: ${{ secrets.https://gmncuelonmicdbpuacqi.supabase.co }}
          VITE_USER_SUPABASE_ANON_KEY: ${{ secrets.sb_publishable_u09NHV7z9E-2CJ0tvQ8IvQ_xcSXfs0F }}
          VITE_MOKIO_SUPABASE_URL: ${{ secrets.https://kxqherkdmnqfscbzsoxq.supabase.co }}
          VITE_MOKIO_SUPABASE_ANON_KEY: ${{ secrets.sb_publishable_Kh8F9sYevLtVDVmRtCQFWg_dst_0oD9 }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
