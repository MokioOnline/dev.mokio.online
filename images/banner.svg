<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Mokio logo</title>
  <desc id="desc">A vivid M monogram formed from connected paths, paired with the Mokio wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="76" y1="75" x2="430" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25336F"/>
      <stop offset="1" stop-color="#10152F"/>
    </linearGradient>
    <linearGradient id="stroke" x1="125" y1="135" x2="375" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E7FF"/>
      <stop offset=".53" stop-color="#7D8CFF"/>
      <stop offset="1" stop-color="#C76BFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App icon: an M built as a connected ecosystem of browser, music, chat, and play nodes. -->
  <rect x="72" y="72" width="456" height="456" rx="126" fill="url(#bg)"/>
  <rect x="73.5" y="73.5" width="453" height="453" rx="124.5" fill="none" stroke="#7487D7" stroke-opacity=".22" stroke-width="3"/>
  <path d="M150 397V202L240 325L300 245L374 397V202" fill="none" stroke="url(#stroke)" stroke-linecap="round" stroke-linejoin="round" stroke-width="36" filter="url(#glow)"/>
  <circle cx="150" cy="202" r="18" fill="#55E7FF"/>
  <circle cx="240" cy="325" r="18" fill="#7D8CFF"/>
  <circle cx="300" cy="245" r="18" fill="#A47BFF"/>
  <circle cx="374" cy="202" r="18" fill="#D476FF"/>
  <path d="M284 242l31 18-31 18z" fill="#FFF" opacity=".96"/>

  <!-- Wordmark -->
  <g fill="#182043">
    <text x="600" y="355" font-family="Arial, Helvetica, sans-serif" font-size="218" font-weight="700" letter-spacing="-12">Mokio</text>
  </g>
  <rect x="614" y="397" width="220" height="12" rx="6" fill="url(#stroke)"/>
  <text x="600" y="462" fill="#657093" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="8">PLAY. CONNECT. CREATE.</text>
</svg>
