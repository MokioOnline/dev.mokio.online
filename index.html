<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mokio Dev</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="gate" class="gate">
    <img src="images/logo.svg" alt="Mokio">
    <h1>Mokio Dev</h1>
    <p>Sign in to open the project in development.<br>Tester, dev, and owner only.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button type="button" id="loginBtn">Sign In</button>
    <p class="note" id="note"></p>
  </div>

  <div id="shell" class="shell" hidden>
    <header class="bar">
      <div class="brand">
        <img src="images/logo.svg" alt="">
        <span>Current project</span>
      </div>
      <div class="bar-right">
        <span id="who"></span>
        <button type="button" id="signOutBtn">Sign out</button>
      </div>
    </header>
    <iframe id="project" title="Project in development"></iframe>
  </div>

  <script src="app.js"></script>
</body>
</html>
