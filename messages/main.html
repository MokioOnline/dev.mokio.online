<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mokio</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <button id="homeBtn" title="Home"><img class="home" src="mokio-logo.png" alt="Mokio"></button>
      <div class="rule"></div>
      <div id="servers"></div>
      <button class="orb" id="newServerBtn" title="New server">+</button>
    </aside>

    <aside class="mid">
      <div class="mid-top" id="midTitle">Direct messages</div>
      <div class="mid-list" id="dmList">
        <button class="mid-item on" id="friendsBtn">Friends</button>
        <button class="mid-item" id="notesBtn">Notifications</button>
        <div id="convos"></div>
      </div>
      <div class="mid-list" id="serverList" hidden>
        <div class="h">Text</div>
        <div id="textChannels"></div>
        <button class="mid-item" id="addTextBtn">+ text channel</button>
        <div class="h">Voice</div>
        <div id="voiceChannels"></div>
        <button class="mid-item" id="addVoiceBtn">+ voice channel</button>
        <form id="inviteForm" class="invite">
          <input name="handle" placeholder="Invite @username">
        </form>
      </div>
      <button class="mebar" id="meBtn">
        <div class="avatar" id="meAv">M</div>
        <div>
          <div class="name" id="meName">—</div>
          <div class="sub" id="meSub">online</div>
        </div>
      </button>
    </aside>

    <section class="main">
      <header class="top">
        <span id="title">Friends</span>
        <button class="ghost" id="callBtn" hidden>Call</button>
        <button class="ghost" id="settingsBtn">Settings</button>
      </header>
      <div id="incoming" class="incoming" hidden>
        <span id="incomingText">Incoming call</span>
        <button class="send" id="acceptCall" type="button">Accept</button>
        <button class="ghost" id="declineCall" type="button">Decline</button>
      </div>

      <div id="friendsPane" class="body">
        <form id="addFriend" class="inline">
          <input class="field" name="handle" placeholder="Add friend by username or email">
          <button class="send" type="submit">Add</button>
        </form>
        <div class="h">Friends</div>
        <div id="friends"></div>
      </div>

      <div id="notesPane" class="body" hidden>
        <div class="h">Notifications</div>
        <div id="notes"></div>
      </div>

      <div id="settingsPane" class="body" hidden>
        <div class="h">Profile</div>
        <div class="preview" id="preview">
          <div class="banner" id="banner"></div>
          <div class="preview-row">
            <div class="avatar lg" id="prevAv">M</div>
            <div>
              <div id="prevName">You</div>
              <div class="sub" id="prevUser">@user</div>
            </div>
          </div>
        </div>
        <label>Display name<input class="field" id="displayName"></label>
        <label>Bio<textarea class="field area" id="bio"></textarea></label>
        <label>Pronouns<input class="field" id="pronouns"></label>
        <label>Accent color<input class="field" id="color" type="color" value="#4fc3f7"></label>
        <label>Banner color<input class="field" id="bannerColor" type="color" value="#12141c"></label>
        <label>Status
          <select class="field" id="status">
            <option value="online">online</option>
            <option value="dnd">do not disturb</option>
            <option value="invisible">invisible</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="hideOnline"> Hide online status</label>
        <button class="send" id="saveProfile">Save profile</button>
        <p class="sub" id="saveNote"></p>
      </div>

      <div id="chatPane" hidden>
        <div id="thread" class="thread"></div>
        <div id="emojiBar" class="emoji" hidden></div>
        <form id="composer" class="composer">
          <button type="button" id="emojiBtn" class="ghost">☺</button>
          <input name="body" placeholder="Message" autocomplete="off">
          <button class="send" type="submit">Send</button>
        </form>
      </div>

      <div id="voicePane" class="body" hidden>
        <div class="h" id="voiceTitle">Voice</div>
        <div id="voicePeople"></div>
        <div class="voice-controls">
          <button class="send" id="muteBtn" type="button">Mute</button>
          <button class="send" id="camBtn" type="button">Camera</button>
          <button class="ghost" id="leaveVoiceBtn" type="button">Leave</button>
        </div>
        <div id="videos" class="videos"></div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
