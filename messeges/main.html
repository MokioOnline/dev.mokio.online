<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mokio</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <button id="homeBtn" title="Home"><img class="home" src="mokio-logo.png" alt="Mokio"></button>
      <div class="rule"></div>
      <button class="orb" title="Direct messages">DM</button>
    </aside>
    <aside class="mid">
      <div class="mid-top">Direct messages</div>
      <div class="mid-list">
        <button class="mid-item on" id="friendsBtn">Friends</button>
        <div id="convos"></div>
      </div>
      <button class="mebar" id="meBtn">
        <div class="avatar" id="meAv">M</div>
        <div>
          <div class="name" id="meName">—</div>
          <div class="sub" id="meSub">online</div>
        </div>
      </button>
    </aside>
    <section class="main">
      <header class="top">
        <span id="title">Friends</span>
      </header>
      <div id="friendsPane" class="body">
        <form id="addFriend">
          <input class="field" name="handle" placeholder="Add friend by username or email">
        </form>
        <div class="h">Friends</div>
        <div id="friends"></div>
      </div>
      <div id="chatPane" hidden>
        <div id="thread" class="thread"></div>
        <form id="composer" class="composer">
          <input name="body" placeholder="Message" autocomplete="off">
          <button class="send" type="submit">Send</button>
        </form>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
